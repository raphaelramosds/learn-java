services:
  api:
    container_name: api
    build:
      context: .
    environment:
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - ${SPRING_SERVER_PORT}:8080
    depends_on:
      db:
        condition: service_healthy
  db:
    container_name: db
    image: mysql:latest
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin --user=root --password=$${DB_ROOT_PASSWORD} --host=localhost ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - ${DB_PORT}:3306
